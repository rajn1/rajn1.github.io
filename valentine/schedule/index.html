<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Valentine Schedule</title>
  <style>
    :root {
      --bg-1: #fff7f2;
      --bg-2: #ffe8da;
      --card: #ffffff;
      --text: #4e2c1d;
      --line: #f2d0bd;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      background: linear-gradient(160deg, var(--bg-1), var(--bg-2));
      color: var(--text);
      font-family: "Avenir Next", "Trebuchet MS", "Segoe UI", sans-serif;
    }

    .card {
      width: min(760px, 100%);
      background: var(--card);
      border-radius: 18px;
      padding: 44px 30px;
      box-shadow: 0 16px 48px rgba(0, 0, 0, 0.12);
    }

    h1 {
      margin: 0 0 30px;
      font-size: clamp(2rem, 6vw, 3.4rem);
      text-align: center;
    }

    .items {
      display: flex;
      flex-direction: column;
      gap: 18px;
    }

    .item {
      border-top: 1px solid var(--line);
      border-bottom: 1px solid var(--line);
      padding: 24px 8px;
      font-size: clamp(1.2rem, 3.5vw, 1.8rem);
      font-weight: 600;
      text-align: center;
    }
  </style>
</head>
<body>
  <main class="card">
    <h1 aria-label="Heart">❤️</h1>
    <section class="items">
      <div class="item">645pm - Dinner 🇯🇵</div>
      <div class="item">8pm - pool rematch 🎱</div>
    </section>
  </main>
  <script>
    const hasOneTimePass = sessionStorage.getItem("valentinePassOnce") === "1";
    if (!hasOneTimePass) {
      window.location.replace("/valentine/");
    } else {
      sessionStorage.removeItem("valentinePassOnce");
    }
  </script>
</body>
</html>
